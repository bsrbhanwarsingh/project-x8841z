<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Regional Routing Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4F46E5;
            --surface: rgba(25, 25, 35, 0.75);
            --text: #ffffff;
            --text-secondary: #a1a1aa;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 380px;
            height: calc(100% - 40px);
            z-index: 10;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            color: var(--text);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-header p {
            margin: 8px 0 0 0;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .loc-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .loc-list::-webkit-scrollbar {
            width: 6px;
        }

        .loc-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        .loc-item {
            padding: 16px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .loc-item:hover, .loc-item.active {
            background: rgba(79, 70, 229, 0.2);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .loc-name {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .loc-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .distance-badge {
            background: rgba(79, 70, 229, 0.3);
            color: #c7d2fe;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .nav-btn:hover {
            background: #4338ca;
        }

        /* Leaflet custom styling */
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        
        .leaflet-popup-content-wrapper {
            background: rgba(25, 25, 35, 0.9) !important;
            backdrop-filter: blur(8px);
            color: white !important;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
        }
        .leaflet-popup-tip {
            background: rgba(25, 25, 35, 0.9) !important;
        }
        .leaflet-popup-content {
            font-family: 'Outfit', sans-serif;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .sidebar {
                top: auto;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 60%;
                border-radius: 24px 24px 0 0;
                border: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }
            .leaflet-control-container .leaflet-bottom {
                bottom: 60%;
                transition: bottom 0.3s;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Regional Routing Dashboard</h1>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <p style="margin:0;"><i class="fa-solid fa-location-dot"></i> <span id="locCount">15</span> Locations</p>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <select id="filterHighway" style="flex:1; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 6px; font-size: 0.75rem; font-family: 'Outfit'; cursor: pointer; outline: none;">
                    <option value="all">All Routes</option>
                    <option value="Jaipur Highway">Jaipur Hwy (NH11)</option>
                    <option value="Sri Ganganagar">Ganganagar Hwy (NH62)</option>
                    <option value="Jodhpur">Jodhpur Hwy (NH62)</option>
                    <option value="Jaisalmer">Jaisalmer Hwy (NH11)</option>
                    <option value="Pugal">Pugal Rd (SH3)</option>
                </select>
                <select id="sortOption" style="flex:1; background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 6px; font-size: 0.75rem; font-family: 'Outfit'; cursor: pointer; outline: none;">
                    <option value="default">Default Sort</option>
                    <option value="distAsc">Distance: Nearest</option>
                    <option value="distDesc">Distance: Farthest</option>
                </select>
            </div>
        </div>
        <div class="loc-list" id="locList">
            <!-- Items injected by JS -->
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const baseCoords = [28.0229, 73.3119];
        
        // Map Initialization with dark theme tiles
        const map = L.map('map', {
            zoomControl: false
        }).setView(baseCoords, 9);
        
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19
        }).addTo(map);

        // Origin Marker
        const originIcon = L.divIcon({
            html: '<div style="background:#4F46E5;width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 0 15px rgba(79,70,229,0.8);"></div>',
            className: '',
            iconSize: [26, 26],
            iconAnchor: [13, 13]
        });

        L.marker(baseCoords, {icon: originIcon}).addTo(map)
            .bindPopup('<b>Base City</b><br>Origin Point')
            .openPopup();

        const locs = [
            { id: 70, name: "SMT GEETA DEVI BAGARI GOVT. GIRLS SSS", area: "Napasar", dist: 27, coords: [27.9733, 73.5458], road: "Via Jaipur Highway (NH11)" },
            { id: 69, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Sherera", dist: 45, coords: [28.25, 73.35], road: "Via Sri Ganganagar Hwy (NH62)" },
            { id: 71, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Kolayat", dist: 50, coords: [27.8443, 72.9647], road: "Via Jaisalmer Highway (NH11)" },
            { id: 83, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Dulchasar", dist: 51, coords: [27.98, 73.85], road: "Via Jaipur Highway (NH11)" },
            { id: 78, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Berasar", dist: 60, coords: [27.53, 73.25], road: "Via Jodhpur Highway (NH62)" },
            { id: 72, name: "GOVT. SENIOR SECONDARY INSTITUTION KALOO", area: "Lunkaransar", dist: 75, coords: [28.52, 73.8], road: "Via Sri Ganganagar Hwy (NH62)" },
            { id: 73, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Lunkaransar", dist: 75, coords: [28.502, 73.7483], road: "Via Sri Ganganagar Hwy (NH62)" },
            { id: 75, name: "GOVT. GIRLS SENIOR SECONDARY INSTITUTION", area: "Lunkaransar", dist: 75, coords: [28.504, 73.746], road: "Via Sri Ganganagar Hwy (NH62)" },
            { id: 76, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Himmatsar", dist: 80, coords: [27.75, 73.33], road: "Via Jodhpur Highway (NH62)" },
            { id: 79, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Chhattargarh", dist: 85, coords: [28.6186, 72.8464], road: "Via Pugal Road (SH3)" },
            { id: 81, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Bigga", dist: 85, coords: [28.11, 74.02], road: "Via Jaipur Highway (NH11)" },
            { id: 77, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Kakra", dist: 88, coords: [27.6, 73.23], road: "Via Jodhpur Highway (NH62)" },
            { id: 84, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Gusainsar Bada", dist: 90, coords: [28.1, 73.95], road: "Via Jaipur Highway (NH11)" },
            { id: 82, name: "GOVT. SENIOR SECONDARY INSTITUTION UPANI", area: "Sridungargarh", dist: 91, coords: [28.25, 74.05], road: "Via Jaipur Highway (NH11)" },
            { id: 74, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Shekhsar", dist: 108, coords: [28.6, 73.85], road: "Via Sri Ganganagar Hwy (NH62)" },
            { id: 80, name: "GOVT. SENIOR SECONDARY INSTITUTION", area: "Momasar", dist: 110, coords: [28.14, 74.34], road: "Via Jaipur Highway (NH11)" }
        ];

        const listContainer = document.getElementById('locList');
        let currentLine = null;
        const markers = {};

        const destinationIcon = L.divIcon({
            html: '<div style="background:#ef4444;width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 0 10px rgba(239,68,68,0.8);"></div>',
            className: '',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        // Add markers once
        locs.forEach((loc) => {
            const marker = L.marker(loc.coords, {icon: destinationIcon});
            const mapsLink = `https://www.google.com/maps/dir/?api=1&origin=${atob('QmlrYW5lciwrUmFqYXN0aGFu')}&destination=${encodeURIComponent(loc.area + atob('LCBCaWthbmVyLCBSYWphc3RoYW4='))}`;
            marker.bindPopup(`
                <strong style="font-size:1.1rem;color:#a5b4fc;">${loc.area}</strong><br>
                <span style="color:#e2e8f0;font-size:0.9rem;">${loc.name}</span><br>
                <div style="margin-top:8px;color:#cbd5e1;">Distance: ~${loc.dist} km</div>
                <a href="${mapsLink}" target="_blank" style="display:inline-block;margin-top:10px;color:#fff;background:#4F46E5;padding:6px 12px;border-radius:6px;text-decoration:none;font-weight:600;font-size:0.8rem;">View on Google Maps</a>
            `);
            markers[loc.id] = marker;
            marker.addTo(map);
        });

        function updateList() {
            const filterVal = document.getElementById('filterHighway').value;
            const sortVal = document.getElementById('sortOption').value;
            
            let filtered = [...locs];
            if (filterVal !== 'all') {
                filtered = filtered.filter(loc => loc.road.includes(filterVal));
            }
            
            if (sortVal === 'distAsc') {
                filtered.sort((a, b) => a.dist - b.dist);
            } else if (sortVal === 'distDesc') {
                filtered.sort((a, b) => b.dist - a.dist);
            } else {
                filtered.sort((a, b) => a.id - b.id);
            }

            document.getElementById('locCount').innerText = filtered.length;
            listContainer.innerHTML = '';
            
            // Show/Hide markers on map based on filter
            locs.forEach(loc => map.removeLayer(markers[loc.id]));
            filtered.forEach(loc => markers[loc.id].addTo(map));
            
            filtered.forEach((loc, index) => {
                const mapsLink = `https://www.google.com/maps/dir/?api=1&origin=${atob('QmlrYW5lciwrUmFqYXN0aGFu')}&destination=${encodeURIComponent(loc.area + atob('LCBCaWthbmVyLCBSYWphc3RoYW4='))}`;
                const item = document.createElement('div');
                item.className = 'loc-item';
                item.innerHTML = `
                    <div class="loc-name">${index + 1}. ${loc.name} - ${loc.area}</div>
                    <div style="font-size: 0.8rem; color: #a5b4fc; font-weight: 600;"><i class="fa-solid fa-road" style="margin-right:4px;"></i> ${loc.road}</div>
                    <div class="loc-meta">
                        <span class="distance-badge"><i class="fa-solid fa-route"></i> ~${loc.dist} km</span>
                        <span>SR NO: ${loc.id}</span>
                    </div>
                    <div style="height: 0; overflow: hidden; transition: height 0.3s;" id="action-${loc.id}">
                        <a href="${mapsLink}" target="_blank" class="nav-btn" onclick="event.stopPropagation()">
                            <i class="fa-solid fa-location-arrow"></i> Navigate
                        </a>
                    </div>
                `;
                
                item.onclick = () => {
                    document.querySelectorAll('.loc-item').forEach(el => {
                        el.classList.remove('active');
                        el.querySelector('div[id^="action-"]').style.height = '0';
                    });
                    item.classList.add('active');
                    document.getElementById(`action-${loc.id}`).style.height = '36px';

                    if (currentLine) map.removeLayer(currentLine);

                    fetch(`https://router.project-osrm.org/route/v1/driving/${baseCoords[1]},${baseCoords[0]};${loc.coords[1]},${loc.coords[0]}?overview=full&geometries=geojson`)
                        .then(response => response.json())
                        .then(data => {
                            if(data.routes && data.routes.length > 0) {
                                const routeCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                                currentLine = L.polyline(routeCoords, { color: '#6366f1', weight: 5, opacity: 0.9, lineCap: 'round', lineJoin: 'round' }).addTo(map);
                                map.fitBounds(currentLine.getBounds(), { padding: [50, 50], duration: 1.5 });
                            } else {
                                currentLine = L.polyline([baseCoords, loc.coords], { color: '#818cf8', weight: 3, opacity: 0.8, dashArray: '10, 10' }).addTo(map);
                                map.flyToBounds(L.latLngBounds([baseCoords, loc.coords]), { padding: [50, 50], duration: 1.5 });
                            }
                            markers[loc.id].openPopup();
                        })
                        .catch(err => {
                            currentLine = L.polyline([baseCoords, loc.coords], { color: '#818cf8', weight: 3, opacity: 0.8, dashArray: '10, 10' }).addTo(map);
                            map.flyToBounds(L.latLngBounds([baseCoords, loc.coords]), { padding: [50, 50], duration: 1.5 });
                            markers[loc.id].openPopup();
                        });
                };
                listContainer.appendChild(item);
            });
            
            if(filtered.length > 0) {
                const allCoords = filtered.map(s => s.coords);
                allCoords.push(baseCoords);
                map.fitBounds(L.latLngBounds(allCoords), { padding: [20, 20] });
            }
        }

        document.getElementById('filterHighway').addEventListener('change', updateList);
        document.getElementById('sortOption').addEventListener('change', updateList);

        // Initial render
        updateList();
    </script>
</body>
</html>
